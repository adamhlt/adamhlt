name: Banner
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # Regenerate when the generator changes
  push:
    branches: ["main"]
    paths: ["scripts/banner.mjs", ".github/workflows/banner.yml", "assets/avatar.webp"]
jobs:
  banner:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate banner.svg
        run: node scripts/banner.mjs banner.svg
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banner.svg assets/avatar.webp
          git diff --cached --quiet || git commit -m "Update banner.svg - [Skip GitHub Action]"
          git pull --rebase
          git push
